name: Build Android App Bundle (Bubblewrap)

# Déclenchement manuel uniquement : va dans l'onglet "Actions" du dépôt sur
# GitHub (même depuis un téléphone), choisis ce workflow, puis "Run workflow".
on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    # Le runner GitHub a son propre Android SDK préinstallé ; on force les
    # deux variables à pointer vers celui que Bubblewrap installe lui-même,
    # pour éviter le conflit "Several environment variables ... contain
    # different paths to the SDK".
    env:
      ANDROID_HOME: /home/runner/.bubblewrap/android_sdk
      ANDROID_SDK_ROOT: /home/runner/.bubblewrap/android_sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restaurer la clé de signature depuis le cache (si elle existe déjà)
        uses: actions/cache@v4
        with:
          path: android/android.keystore
          key: prokil-android-signing-keystore-v1

      - name: Générer la clé de signature (une seule fois, à conserver précieusement)
        working-directory: android
        run: |
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias prokil \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -dname "CN=ProKil, OU=Engineering, O=ProKil, L=Paris, S=IDF, C=FR"
          fi

      - name: Générer le projet Android depuis twa-manifest.json
        working-directory: android
        run: |
          yes y | bubblewrap update --manifest ./twa-manifest.json --skipVersionUpgrade
          ls -la

      - name: Ajouter mavenCentral() en secours des dépôts Gradle
        working-directory: android
        run: |
          sed -i 's/jcenter()/jcenter()\n        mavenCentral()/' build.gradle
          cat build.gradle

      # Play Billing (Digital Goods API) ne fonctionne que si la TWA tourne dans
      # Chrome. Par défaut, androidbrowserhelper ouvre la TWA dans le navigateur
      # par défaut (ex. Samsung Internet), où l'achat échoue avec
      # "clientAppUnavailable". On force Chrome quand il est installé ; la
      # surcharge de createTwaLauncher() nécessite androidbrowserhelper >= 2.7.1.
      - name: Forcer Chrome comme navigateur de la TWA (Play Billing)
        working-directory: android
        run: |
          sed -i -E 's/(com\.google\.androidbrowserhelper:androidbrowserhelper:)[0-9.]+/\12.7.3/' app/build.gradle
          grep -n "androidbrowserhelper" app/build.gradle
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("app/src/main/java/com/prokil/app/LauncherActivity.java")
          src = p.read_text()
          override = '''
              @Override
              protected TwaLauncher createTwaLauncher() {
                  String provider = null;
                  try {
                      android.content.pm.ApplicationInfo info =
                              getPackageManager().getApplicationInfo("com.android.chrome", 0);
                      if (info.enabled) {
                          provider = "com.android.chrome";
                      }
                  } catch (android.content.pm.PackageManager.NameNotFoundException ignored) {
                  }
                  return new TwaLauncher(this, provider, SessionStore.makeSessionId(getTaskId()),
                          new SharedPreferencesTokenStore(this));
              }
          '''
          imports = ("import com.google.androidbrowserhelper.trusted.TwaLauncher;\n"
                     "import com.google.androidbrowserhelper.trusted.SessionStore;\n"
                     "import com.google.androidbrowserhelper.trusted.SharedPreferencesTokenStore;\n")
          src = src.replace("import android.os.Bundle;\n", "import android.os.Bundle;\n" + imports, 1)
          idx = src.rstrip().rfind("}")
          src = src[:idx] + override + "}\n"
          p.write_text(src)
          print(src)
          PY

      - name: Accepter les licences du SDK Android
        run: |
          SDKMGR="$ANDROID_HOME/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then SDKMGR="$ANDROID_HOME/tools/bin/sdkmanager"; fi
          yes | "$SDKMGR" --licenses --sdk_root="$ANDROID_HOME" || true
          yes | "$SDKMGR" --licenses --sdk_root="$ANDROID_HOME"

      - name: Construire l'App Bundle (.aab)
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bubblewrap build --manifest ./twa-manifest.json

      - name: Générer assetlinks.json (empreinte SHA-256 de la clé)
        working-directory: android
        run: |
          FINGERPRINT=$(keytool -list -v -keystore android.keystore -alias prokil \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep "SHA256:" | sed 's/.*SHA256: //')
          echo "Empreinte SHA-256 : $FINGERPRINT"
          cat > assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.prokil.app",
              "sha256_cert_fingerprints": ["$FINGERPRINT"]
            }
          }]
          EOF
          cat assetlinks.json

      - name: Publier les fichiers générés
        uses: actions/upload-artifact@v4
        with:
          name: prokil-android
          path: |
            android/app-release-bundle.aab
            android/android.keystore
            android/assetlinks.json
          retention-days: 30
          if-no-files-found: warn
